name: Release

# Publishes to npm from GitHub Actions when a version tag is pushed:
#   npm version patch && git push --follow-tags
# The package is never published from a laptop.
#
# FIRST RELEASE ONLY uses the NPM_TOKEN repository secret (a package that does not exist yet cannot have a
# trusted publisher). After it is published: on npmjs.com open package "secretmgr" > Settings > Trusted Publisher >
# GitHub Actions (repository me-sharif-hasan/secret-manager-mcp-for-ai-agents, workflow release.yml), then delete the
# `env:` block under "Publish", delete the NPM_TOKEN secret and revoke the token. Later releases need no stored secret.

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install zsh (shell hook tests)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm ci
      - run: npm run build:dashboard
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
